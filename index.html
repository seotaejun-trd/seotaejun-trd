<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서태준의 매매일지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 460px;
    }
    .profile {
      text-align: center;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 28px;
    }
    .profile h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #ffffff;
    }
    .profile .handle {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }
    .profile .bio {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 14px 18px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .link-item:hover {
      background: #222;
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }
    .link-item:active {
      transform: scale(0.98);
    }
    .link-item.featured {
      border-color: #2563eb;
    }
    .icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
    }
    .icon-blue   { background: #1e3a5f; }
    .icon-green  { background: #1a3a2a; }
    .icon-yellow { background: #3a2e10; }
    .icon-red    { background: #3a1a1a; }
    .link-text { flex: 1; }
    .link-text .title {
      font-size: 14px;
      font-weight: 500;
      color: #f0f0f0;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      background: #1e3a5f;
      color: #60a5fa;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 400;
    }
    .link-text .sub {
      font-size: 12px;
      color: #555;
    }
    .arrow {
      font-size: 16px;
      color: #444;
    }
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <div class="avatar">📈</div>
      <h1>서태준의 매매일지</h1>
      <p class="handle">@seotaejun-trd</p>
      <p class="bio">알고리즘 기반 전략 운용 · EA 개발자<br>퀀트 트레이더 · 실전 매매 공유</p>
    </div>

    <div class="links">

      <a href="https://t.me/+tkCw6dh7jVszNzY1" class="link-item" target="_blank" rel="noopener">
        <div class="icon-wrap icon-blue">👥</div>
        <div class="link-text">
          <div class="title">알고리즘 전략 운용 공유방 입장</div>
          <div class="sub">실전 운용 데이터 · 수익 현황 공개</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="https://t.me/seotaejun_trd" class="link-item" target="_blank" rel="noopener">
        <div class="icon-wrap icon-green">💬</div>
        <div class="link-text">
          <div class="title">1:1 개인 메신저</div>
          <div class="sub">문의 · 상담 · 매매 아이디어 공유</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="https://seotaejun-trd.github.io/seotaejun-trd/program/" class="link-item featured" target="_blank" rel="noopener">
        <div class="icon-wrap icon-yellow">⚙️</div>
        <div class="link-text">
          <div class="title">알고리즘 기반 전략 운용 체험 <span class="badge">무료</span></div>
          <div class="sub">테스트 EA 세팅 · 직접 적용 지원</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="https://www.youtube.com/@seotaejun-trd" class="link-item" target="_blank" rel="noopener">
        <div class="icon-wrap icon-red">▶️</div>
        <div class="link-text">
          <div class="title">유튜브 채널</div>
          <div class="sub">매매전략 · 실전 운용 영상 공개</div>
        </div>
        <span class="arrow">→</span>
      </a>

    </div>

    <p class="footer">© 2026 서태준의 매매일지 · @seotaejun-trd</p>
  </div>
</body>
</html>
